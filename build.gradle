plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter { includeGroup "maven.modrinth" }
    }
	maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
	maven {
    	name = "Xander Maven"
    	url = "https://maven.isxander.dev/releases"
	}
	maven {
		name = "Xander Maven Snapshots"
		url = "https://maven.isxander.dev/snapshots"
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation ("dev.isxander:yet-another-config-lib:${project.yacl_version}") {
		exclude group: "com.twelvemonkeys.imageio"
		exclude group: "com.twelvemonkeys.common"
	}

	modCompileOnly "maven.modrinth:mOgUt4GM:${project.modmenu_version}"
	//uncomment or comment this if want Mod Menu on runtime
	modRuntimeOnly "maven.modrinth:mOgUt4GM:${project.modmenu_version}"

	modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	//uncomment or comment this if want Sodium on runtime
	modRuntimeOnly "maven.modrinth:sodium:${project.sodium_version}"

	modCompileOnly "maven.modrinth:indium:${project.indium_version}"
	//uncomment or comment this if want Indium on runtime
	modRuntimeOnly "maven.modrinth:indium:${project.indium_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	toolchain{
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
	javaLauncher = javaToolchains.launcherFor(java.toolchain)
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}